spring.application.name=minifb

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minifb?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:minifb}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=21MB

server.error.include-stacktrace=never
server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger chỉ bật ở profile dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl=15m
app.auth.refresh-ttl=7d
app.auth.reuse-grace=10s
app.auth.cookie-secure=true

app.media.signing-secret=${MEDIA_SIGNING_SECRET}
app.media.root=${MEDIA_ROOT:uploads}

# Chỉ cấu hình ở dev; production cùng domain qua reverse proxy
app.cors.allowed-origins=
