# Ví dụ reverse proxy production: SPA và API cùng domain, bắt buộc HTTPS.
# Cookie refresh (SameSite=Strict; Secure) và URL ảnh tương đối cần cùng domain.
# Backend chạy với profile `prod` (server.forward-headers-strategy=native).

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # Khớp spring.servlet.multipart.max-request-size (4 ảnh x 5 MB + nội dung)
  client_max_body_size 21m;

  # Header cho SPA (header của API do Spring Security gắn)
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; object-src 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  root /var/www/minifb;   # nội dung frontend/dist

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: mọi đường dẫn khác trả index.html
  location / {
    try_files $uri /index.html;
  }
}
